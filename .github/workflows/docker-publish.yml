name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream linuxserver/chrome digest tag
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect lscr.io/linuxserver/chrome:latest --raw)"
          digest="$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
          short="${digest:0:12}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=upstream-$short" >> "$GITHUB_OUTPUT"

      - name: Resolve latest @playwright/mcp release
        id: mcp
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view @playwright/mcp version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected @playwright/mcp version: '$version'" >&2
            exit 1
          fi
          echo "Resolved @playwright/mcp $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "key=${{ steps.upstream.outputs.tag }}-mcp-$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether build is needed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker manifest inspect ghcr.io/${{ github.repository }}:${{ steps.mcp.outputs.key }} >/dev/null 2>&1; then
            echo "Image tag ghcr.io/${{ github.repository }}:${{ steps.mcp.outputs.key }} already exists, skipping scheduled rebuild."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        if: steps.gate.outputs.should_build == 'true'
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ steps.upstream.outputs.tag }}
            type=raw,value=${{ steps.mcp.outputs.key }}
          labels: |
            org.opencontainers.image.title=chrome-selkies-cdp
            org.opencontainers.image.description=Thin downstream of linuxserver/chrome with optional CDP forwarding and scheduled recycle
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=lscr.io/linuxserver/chrome:latest
            org.opencontainers.image.version=${{ steps.mcp.outputs.key }}
            io.github.sandlong.playwright-mcp.version=${{ steps.mcp.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        if: steps.gate.outputs.should_build == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLAYWRIGHT_MCP_VERSION=${{ steps.mcp.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip note
        if: steps.gate.outputs.should_build != 'true'
        run: echo "No new linuxserver/chrome digest or @playwright/mcp release, scheduled publish skipped."
