services:
  chrome-selkies-cdp:
    build: .
    container_name: chrome-selkies-cdp
    ports:
      - "3001:3001"   # Chrome web UI (HTTPS)
      - "9222:9222"   # CDP, only live when ENABLE_CDP=true
    environment:
      TZ: Asia/Singapore
      CUSTOM_USER: change-me
      PASSWORD: change-me
      ENABLE_CDP: "true"
      CDP_PORT: "9222"
      # Standard 5-field cron expression, evaluated in TZ. Requires restart policy below.
      # CONTAINER_RESTART_CRON: "0 4 * * *"
      # CHROME_CLI: "--disable-gpu"
      # SELKIES_MANUAL_WIDTH: "1440"
      # SELKIES_MANUAL_HEIGHT: "900"
    volumes:
      - chrome-config:/config
    restart: unless-stopped

volumes:
  chrome-config:
